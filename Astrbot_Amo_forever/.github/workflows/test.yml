name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dev deps
        run: pip install -r requirements-dev.txt
      - name: Version check
        run: python tools/check_version.py
      - name: Type check
        run: python -m mypy
      - name: Run tests
        run: coverage run -m pytest tests -q
      - name: Coverage floor
        run: coverage report
